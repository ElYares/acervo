name: acervo

services:
  # Los volumenes nombrados nacen root:root porque sus rutas no existen en las
  # imagenes. Nessie corre como 10000 y Spark como 185, y ninguno puede escribir
  # en un directorio de root. Este job lo arregla antes de que arranquen.
  volumes-init:
    image: busybox:1.37
    command: >
      sh -c "
      mkdir -p /nessie/data /ivy &&
      chown -R 10000:10001 /nessie/data &&
      chown -R 185:185 /ivy &&
      echo 'permisos listos'
      "
    volumes:
      - nessie-data:/nessie/data
      - spark-ivy:/ivy
    restart: "no"

  # Object store. Es el disco del lakehouse: todo Iceberg aterriza aqui.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-acervo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-acervo123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Crea los buckets y termina. No es un servicio permanente.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-acervo} ${MINIO_ROOT_PASSWORD:-acervo123} &&
      mc mb --ignore-existing local/warehouse &&
      mc mb --ignore-existing local/raw &&
      echo 'buckets listos'
      "
    restart: "no"

  # Catalogo Iceberg con ramas tipo git. Expone Iceberg REST en /iceberg.
  nessie:
    image: ghcr.io/projectnessie/nessie:0.104.3
    depends_on:
      volumes-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      NESSIE_VERSION_STORE_TYPE: ROCKSDB
      NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH: /nessie/data
      # Nessie guarda solo metadatos del catalogo. No conoce MinIO ni tiene
      # credenciales de S3: quien lee y escribe objetos es Spark. Eso deja a
      # Nessie sin ninguna configuracion de almacenamiento que mantener.
    ports:
      - "19120:19120"
    volumes:
      - nessie-data:/nessie/data
    # El 9000 es la interfaz de management de Quarkus, no la API. Y se prueba
    # /ready, no /live: /live responde 200 aunque el catalogo no alcance a MinIO.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Motor de proceso en modo Spark Connect. La imagen de apache/spark no trae
  # el plugin de connect ni los jars de Iceberg: llegan por --packages y se
  # cachean en el volumen spark-ivy.
  spark:
    image: apache/spark:3.5.6-scala2.12-java17-python3-ubuntu
    depends_on:
      volumes-init:
        condition: service_completed_successfully
      nessie:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-acervo}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-acervo123}
      AWS_REGION: us-east-1
    command:
      - /opt/spark/sbin/start-connect-server.sh
      - --packages
      # hadoop-aws 3.3.4 y no otra: la imagen trae hadoop-client 3.3.4 y S3A
      # tiene que coincidir con el Hadoop que ya esta dentro. Arrastra el
      # aws-java-sdk-bundle v1 que S3A necesita, que no es el SDK v2 que trae
      # iceberg-aws-bundle: cada camino a MinIO usa el suyo.
      - org.apache.spark:spark-connect_2.12:3.5.6,org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.1,org.apache.iceberg:iceberg-aws-bundle:1.9.1,org.apache.hadoop:hadoop-aws:3.3.4,org.projectnessie.nessie-integrations:nessie-spark-extensions-3.5_2.12:0.104.3
      - --conf
      - spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions
      - --conf
      - spark.sql.catalog.acervo=org.apache.iceberg.spark.SparkCatalog
      - --conf
      - spark.sql.catalog.acervo.catalog-impl=org.apache.iceberg.nessie.NessieCatalog
      - --conf
      - spark.sql.catalog.acervo.uri=http://nessie:19120/api/v2
      - --conf
      - spark.sql.catalog.acervo.ref=main
      - --conf
      - spark.sql.catalog.acervo.warehouse=s3://warehouse/
      - --conf
      - spark.sql.catalog.acervo.io-impl=org.apache.iceberg.aws.s3.S3FileIO
      - --conf
      - spark.sql.catalog.acervo.s3.endpoint=http://minio:9000
      - --conf
      - spark.sql.catalog.acervo.s3.path-style-access=true
      - --conf
      - spark.sql.defaultCatalog=acervo
      # Segundo camino al mismo MinIO. Lo de arriba configura el catalogo, que
      # usa S3FileIO de Iceberg; leer una ruta suelta con s3a:// no pasa por
      # ahi, sino por el FileSystem de Hadoop, que se configura aparte. Sin
      # este bloque, `spark.read.parquet("s3a://raw/...")` no encuentra las
      # credenciales aunque el catalogo funcione perfecto.
      - --conf
      - spark.hadoop.fs.s3a.endpoint=http://minio:9000
      - --conf
      - spark.hadoop.fs.s3a.access.key=${MINIO_ROOT_USER:-acervo}
      - --conf
      - spark.hadoop.fs.s3a.secret.key=${MINIO_ROOT_PASSWORD:-acervo123}
      - --conf
      - spark.hadoop.fs.s3a.path.style.access=true
      # Explicito en vez de la cadena por defecto: sin esto S3A prueba
      # proveedores en orden y termina intentando credenciales de instancia
      # IAM, que aqui no existen y solo sirven para confundir el fallo.
      - --conf
      - spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    ports:
      - "15002:15002"
      - "4040:4040"
    volumes:
      - spark-ivy:/home/spark/.ivy2
    restart: unless-stopped

volumes:
  minio-data:
  nessie-data:
  spark-ivy:
